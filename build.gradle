plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.sirin5dwaves'
base { archivesName = 'sirin-5d-waves' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft { mappings channel: 'official', version: '1.20.1' }

repositories { maven { url = 'https://maven.minecraftforge.net' } }

dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }

jar { finalizedBy 'reobfJar' }

sourceSets.main.resources.srcDir 'src/generated/resources'

runs {
    configureEach {
        workingDirectory project.file('run')
        property 'forge.logging.markers', 'REGISTRIES'
        property 'forge.logging.console.level', 'debug'
        mods { sirin5dwaves { source sourceSets.main } }
    }
    client { }
    server { }
}
