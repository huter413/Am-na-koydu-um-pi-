name: Build Sirin 5D Waves

on:
  push:
    branches: [ main, 5d-waves ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compile and build Forge 1.20.1 mod
        run: gradle --no-daemon --stacktrace build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: sirin-5d-waves
          path: build/libs/*.jar
          if-no-files-found: error
